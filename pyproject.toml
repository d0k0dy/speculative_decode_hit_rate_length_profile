[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "d0k0dy-speculative_decode_hit_rate_length_profile"
version = "0.1.0"
description = "按段落统计Prompt 工程负责人·投机解码的命中率相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "d0k0dy" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://d0k0dy.github.io"
Repository = "https://github.com/d0k0dy/speculative_decode_hit_rate_length_profile"
Issues = "https://github.com/d0k0dy/speculative_decode_hit_rate_length_profile/issues"

[project.scripts]
speculative_decode_hit_rate_length_profile = "speculative_decode_hit_rate_length_profile:main"

[tool.setuptools]
py-modules = ["speculative_decode_hit_rate_length_profile"]
